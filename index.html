<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jennifer Lewis | Real Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#2B2420;
    --cream:#EDE6D8;
    --turquoise:#3E9C93;
    --clay:#A85D3E;
    --bone:#F7F3EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bone);
    color:var(--charcoal);
    line-height:1.5;
  }
  a:focus-visible{outline:2px solid var(--bone);outline-offset:4px;border-radius:2px;}
  .wrap{
    max-width:1000px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    min-height:100vh;
    min-height:100svh;
  }
  .left{
    background:var(--charcoal);
    color:var(--bone);
    padding:64px 56px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.08em;
    color:var(--turquoise);
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:44px;
    line-height:1.08;
    max-width:9ch;
  }
  .rule{
    width:64px;
    height:3px;
    background:var(--clay);
    margin:28px 0;
  }
  .tagline{
    font-size:17px;
    color:#D8CFC0;
    max-width:32ch;
  }
  .contact{
    margin-top:48px;
  }
  .contact a{
    color:inherit;
    text-decoration:none;
    overflow-wrap:anywhere;
    text-underline-offset:4px;
  }
  .contact a:hover{text-decoration:underline;text-decoration-color:var(--turquoise);}
  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-top:1px solid rgba(247,243,234,0.12);
    font-size:16px;
  }
  .contact-row:last-child{border-bottom:1px solid rgba(247,243,234,0.12);}
  .contact-row .ico{
    width:34px;height:34px;flex:none;
    border-radius:50%;
    border:1px solid var(--turquoise);
    display:flex;align-items:center;justify-content:center;
    color:var(--turquoise);
  }
  .footer-name{
    margin-top:56px;
  }
  .footer-name .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:.02em;
  }
  .footer-name .sponsor{
    font-size:13px;
    color:#B9AF9E;
    margin-top:4px;
  }
  .right{
    position:relative;
    background:var(--cream);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden;
  }
  .right img{
    width:100%;
    max-width:420px;
    height:auto;
    display:block;
    object-fit:cover;
    filter:saturate(1.03);
  }
  .badge{
    position:absolute;
    top:32px;
    right:32px;
    background:var(--bone);
    color:var(--charcoal);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(43,36,32,0.15);
  }
  .left > *{animation:reveal .65s ease-out both;}
  .left > :last-child{animation-delay:.12s;}
  .right img{animation:portrait .8s .08s ease-out both;}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes portrait{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (max-width:760px){
    .wrap{grid-template-columns:1fr;}
    .left{padding:48px 32px;order:2;}
    .right{order:1;padding-top:24px;min-height:52svh;}
    h1{font-size:34px;}
    .badge{top:20px;right:20px;}
  }
  @media (prefers-reduced-motion:reduce){.left > *,.right img{animation:none;}}
</style>
</head>
<body>
<main class="wrap">
  <section class="left" aria-labelledby="page-title">
    <div>
      <p class="eyebrow">TEXAS REAL ESTATE</p>
      <h1 id="page-title">Let&rsquo;s talk about your next move.</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">Whether you&rsquo;re buying, selling, or just weighing your options &mdash; reach out and let&rsquo;s find the right path forward.</p>

      <div class="contact">
        <div class="contact-row">
          <span class="ico" aria-hidden="true">&#9742;</span>
          <a href="tel:8179953765">817-995-3765</a>
        </div>
        <div class="contact-row">
          <span class="ico" aria-hidden="true">&#9993;</span>
          <a href="mailto:jenniferlewis94@yahoo.com">jenniferlewis94@yahoo.com</a>
        </div>
      </div>
    </div>

    <div class="footer-name">
      <div class="name">Jennifer Lewis</div>
      <div class="sponsor">Sponsored by Attorney Broker Services</div>
    </div>
  </section>

  <section class="right" aria-label="Jennifer Lewis portrait">
    <div class="badge">Realtor</div>
    <img src="assets/jennifer-lewis.png" alt="Jennifer Lewis">
  </section>
</main>
</body>
</html>
